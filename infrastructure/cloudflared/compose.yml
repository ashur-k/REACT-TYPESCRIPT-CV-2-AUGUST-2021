services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: resume-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - resume_edge

networks:
  resume_edge:
    external: true
    name: resume_edge
