services:
  db:
    container_name: resume-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in infrastructure/local/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in infrastructure/local/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infrastructure/local/.env}
    volumes:
      - resume_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - resume-local-network

  backend:
    container_name: resume-backend
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - ../../.env
      - .env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,frontend
      DB_NAME: ${DB_NAME:?Set DB_NAME in infrastructure/local/.env}
      DB_USER: ${DB_USER:?Set DB_USER in infrastructure/local/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infrastructure/local/.env}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../backend:/app/backend
      - ../../base:/app/base
      - ../../blog:/app/blog
      - ../../work_projects:/app/work_projects
      - ../../manage.py:/app/manage.py
      - resume_media_data:/app/static/images
    networks:
      - resume-local-network

  frontend:
    container_name: resume-frontend
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      nginx:
        condition: service_started
    networks:
      - resume-local-network

  nginx:
    container_name: resume-nginx
    build:
      context: ../..
      dockerfile: infrastructure/local/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?Set DJANGO_ADMIN_PATH in project root .env}
      NGINX_ENVSUBST_FILTER: "^DJANGO_ADMIN_PATH$"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - resume_media_data:/var/www/media:ro
    networks:
      - resume-local-network

volumes:
  resume_postgres_data:
  resume_media_data:
  frontend_build:

networks:
  resume-local-network:
    name: resume-local-network
    driver: bridge
