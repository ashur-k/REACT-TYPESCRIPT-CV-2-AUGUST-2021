services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - resume_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?Set DJANGO_ADMIN_PATH}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - resume_media_data:/app/static/images

  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?Set DJANGO_ADMIN_PATH}
      NGINX_ENVSUBST_FILTER: "^DJANGO_ADMIN_PATH$"
    depends_on:
      - backend
    volumes:
      - resume_media_data:/var/www/media:ro
    networks:
      - default
      - resume_edge

volumes:
  resume_postgres_data:
  resume_media_data:

networks:
  resume_edge:
    external: true
    name: resume_edge
